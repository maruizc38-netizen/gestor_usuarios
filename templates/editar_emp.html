<!DOCTYPE html>
<html>
<head>
    <title>Editar Empleado</title>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h2 class="text-center mb-4">Editar Empleado</h2>

        <form action="{{ url_for('actualizar_empleado') }}" method="POST">

            <!-- DOCUMENTO OCULTO -->
            <input type="hidden" name="documento" value="{{ empleado.documento }}">

            <!-- NOMBRE -->
            <label>Nombres</label>
            <input type="text" name="nombre" class="form-control mb-2" 
                   value="{{ empleado.nombre }}" required>

            <!-- APELLIDO -->
            <label>Apellidos</label>
            <input type="text" name="apellido" class="form-control mb-2" 
                   value="{{ empleado.apellido }}" required>

            <!-- CARGO -->
            <label>Cargo</label>
            <input type="text" name="cargo" class="form-control mb-2" 
                   value="{{ empleado.cargo }}" required>

            <!-- DEPARTAMENTO -->
            <label>Departamento</label>
            <select name="id_area" class="form-control mb-3" required>
                {% for d in departamentos %}
                <option value="{{ d.id_area }}"
                    {% if d.id_area == empleado.id_area %}selected{% endif %}>
                    {{ d.nombre_area }}
                </option>
                {% endfor %}
            </select>

            <!-- BOTONES -->
            <button class="btn btn-success">Actualizar</button>
            <a href="{{ url_for('panelempleado') }}" class="btn btn-secondary">Volver</a>

        </form>

    </div>
</div>

</body>
</html>
